name: Actualizar archivo

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-archivo
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar desde la web pública
        run: python3 scripts/sincronizar_desde_web.py

      - name: Validar el archivo completo
        run: |
          python3 scripts/validar_archivo.py
          git diff --check

      - name: Publicar solo si hay cambios
        shell: bash
        run: |
          if git diff --quiet -- episodios indice datos; then
            echo "No hay cambios publicados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- episodios indice datos
          git commit -m "Actualizar transcripciones publicadas"
          git push
